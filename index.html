  --font-num:'Zen Kaku Gothic New','Noto Sans JP','Hiragino Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101115;--surface:#1B1C21;--ink:#F2F2F4;--ink2:#A4A7AE;--line:#2C2E35;--chip:#272930;
    --red:#FF6B80;--in:#6DB2F0;--bar:#5FA8C8;--warn-bg:#3A1D24;--info-bg:#1C2D3B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101115;--surface:#1B1C21;--ink:#F2F2F4;--ink2:#A4A7AE;--line:#2C2E35;--chip:#272930;
  --red:#FF6B80;--in:#6DB2F0;--bar:#5FA8C8;--warn-bg:#3A1D24;--info-bg:#1C2D3B;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
svg{display:block}
.wrap{max-width:520px;margin-inline:auto}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 0 0 100vmax var(--surface);clip-path:inset(0 -100vmax)}
.top .in{max-width:520px;margin-inline:auto;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px}
.hbtn{background:none;border:0;padding:6px;border-radius:50%;color:var(--ink);display:grid;place-items:center}
.hbtn svg{width:28px;height:28px}
.help{margin-top:14px;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink2)}
.help b{color:var(--ink)}
.help p{margin:0 0 6px}
.help p:last-child{margin:0}

main{padding-top:14px;padding-bottom:120px;display:block}

/* notice */
.notice{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:1px 14px;border-radius:4px}
.tag.warn{background:#E8636F}
.tag.info{background:#3B7FB5}
.tag.plain{background:#7B8089}
.notice p{margin:0;font-size:15px}

/* summary card */
.card{position:relative;overflow:hidden;margin-top:14px;border-radius:26px;color:#fff;text-align:center;padding:20px 12px 18px;
  background:linear-gradient(200deg,#4C98B2 0%,#2B7BA6 38%,#0F4D99 78%,#08377F 100%)}
.card::after{content:"";position:absolute;inset:-30% -20% auto auto;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 68%);pointer-events:none}
.card>*{position:relative;z-index:1}
.clabel{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;opacity:.95}
.coin{width:22px;height:22px;border-radius:50%;background:#2DBE6C;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.pill{display:inline-flex;align-items:center;margin-top:12px;background:#fff;color:#14161A;border-radius:999px;padding:4px}
.pill button{width:36px;height:36px;border-radius:50%;border:0;background:none;color:#C4122F;display:grid;place-items:center;padding:0}
.pill button svg{width:20px;height:20px}
.pill span{font-weight:700;font-size:17px;padding:0 8px;min-width:7.5em}
.bal{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:14px}
.bal .big{font-family:var(--font-num);font-weight:700;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bal .unit{font-weight:700;font-size:20px}
.eye{margin-left:10px;background:none;border:0;color:#fff;padding:4px;align-self:center;opacity:.9}
.eye svg{width:28px;height:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}
.stats>div{padding:2px 4px;border-left:1px solid rgba(255,255,255,.32);min-width:0}
.stats>div:first-child{border-left:0}
.stats small{display:block;font-size:12px;opacity:.88}
.stats b{display:block;font-family:var(--font-num);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats b i{font-style:normal;font-size:11px;font-weight:500;margin-left:1px}

/* shortcut grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;margin:24px 0 20px}
.sc{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;line-height:1.3;padding:0;color:var(--ink)}
.ic{width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ic svg{width:28px;height:28px}
.ic.r{color:var(--red)}
.ic.b{color:var(--in)}

/* panels and rows */
.panel{background:var(--surface);border-radius:14px;padding:6px 14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.ph h2{margin:0;font-size:16px}
.link{background:none;border:0;color:var(--red);font-weight:700;font-size:14px;padding:4px 0}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--ink2);display:grid;place-items:center;font-weight:700;font-size:15px}
.mid{flex:1;min-width:0}
.mid .cat{font-weight:700;font-size:15px;line-height:1.35}
.mid .sub{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.amt{font-family:var(--font-num);font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in{color:var(--in)}
.amt i{font-style:normal;font-size:12px;font-weight:500;margin-left:1px}
.stag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--chip);color:var(--ink2);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}
.del{background:none;border:0;color:var(--ink2);font-size:12px;padding:6px 2px;text-decoration:underline;text-underline-offset:2px}
.del.arm{color:var(--red);font-weight:700}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin:18px 4px 6px;font-weight:500}
.dayh b{font-family:var(--font-num);color:var(--ink)}
.empty{text-align:center;padding:22px 10px;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

.primary{background:var(--btn);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:16px;padding:13px 22px;width:100%}
.btnrow .primary{width:auto}
.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;font-weight:700;font-size:14px;padding:11px 18px}
.ghost.danger{color:var(--red)}
.ghost.arm{background:var(--btn);color:#fff;border-color:var(--btn)}

/* month pill on light pages */
.mnav{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:14px}
.mnav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--red);display:grid;place-items:center;padding:0}
.mnav button svg{width:20px;height:20px}
.mnav span{font-weight:700;font-size:18px;min-width:8em;text-align:center}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:999px;padding:3px;gap:3px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;border-radius:999px;padding:9px 0;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* form */
.form{display:flex;flex-direction:column;gap:6px}
.form label,.form legend{font-size:13px;font-weight:700;color:var(--ink2);margin-top:10px;padding:0}
.form fieldset{border:0;margin:0;padding:0;min-width:0}
.amtbox{display:flex;align-items:baseline;gap:8px;background:var(--surface);border-radius:14px;padding:10px 16px}
.amtbox span{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--ink2)}
.amtbox input{flex:1;min-width:0;border:0;background:none;outline:0;font-family:var(--font-num);font-weight:700;font-size:38px;font-variant-numeric:tabular-nums}
.amtbox:focus-within{outline:2px solid var(--in)}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{position:relative;margin:0!important}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.chip input:checked+span{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--in);outline-offset:2px}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:1.4em;margin:6px 0 0}

/* stats */
.sumbox{background:var(--surface);border-radius:14px;padding:14px 16px}
.sumbox .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sumbox .t b{font-family:var(--font-num);font-size:30px;font-variant-numeric:tabular-nums}
.sumbox .t small{color:var(--ink2);font-size:13px}
.meter{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--bar);border-radius:6px}
.meter.over i{background:var(--red)}
.crow{padding:12px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crow .h b{font-size:15px}
.crow .h span{font-family:var(--font-num);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.crow .h span em{font-style:normal;color:var(--ink);font-weight:700}
.crow .over-t{color:var(--red);font-weight:700}
.crow .meter{height:8px;margin-top:8px}
.days{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);margin-top:8px}
.days i{flex:1;background:var(--bar);border-radius:2px 2px 0 0;min-height:2px}
.days i.z{background:var(--line)}
.days i.td{background:var(--red)}
.dlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px}
.ymax{font-size:12px;color:var(--ink2);text-align:right;font-family:var(--font-num)}

/* menu */
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:500}
.brow:last-child{border-bottom:0}
.brow .inp{display:flex;align-items:center;gap:6px}
.brow input{width:7.5em;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}
.btot{display:flex;justify-content:space-between;padding:12px 0 8px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--ink2);margin:8px 2px 0}
textarea.csv{width:100%;height:120px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11.5px;font-weight:700;color:var(--ink2)}
.tab svg{width:30px;height:30px}
.tab[aria-current="page"]{color:var(--red)}
.tab[aria-current="page"] svg{stroke-width:2.4}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:20;background:#23252B;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:360px){.bal .big{font-size:38px}.stats b{font-size:14px}.ic{width:56px;height:56px}}

/* loading screen: plays once on open, then fades out by CSS alone */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;
  background:linear-gradient(200deg,#4C98B2 0%,#2B7BA6 38%,#0F4D99 78%,#08377F 100%);animation:splashOut .45s ease 1.5s forwards}
#splash .logo{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 14px 36px rgba(8,30,80,.35);animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
#splash .logo svg{width:68px;height:68px;display:block;overflow:visible}
#splash .logo .card{animation:cardUp .7s cubic-bezier(.2,.9,.3,1.2) .25s both}
#splash .nm{font-family:var(--font-num);font-weight:700;font-size:26px;letter-spacing:.14em}
#splash .bar{width:140px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:fill 1.4s ease-out both}
#splash small{font-size:12px;opacity:.85}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cardUp{from{transform:translateY(7px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#splash{animation-duration:.01s;animation-delay:.6s}#splash .logo,#splash .logo .card,#splash .bar i{animation:none}}

/* install banner */
#ib{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-24px);z-index:60;width:min(560px,calc(100vw - 24px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 10px 36px rgba(20,24,40,.18),0 0 0 1px rgba(20,24,40,.05);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#ib.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#ib .ibi{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#6FD3EA,#2B7BA6 55%,#1B3F95)}
#ib .ibi svg{width:32px;height:32px;display:block}
#ib .ibt{flex:1;min-width:0}
#ib .ibt b{display:block;font-size:15px;line-height:1.35}
#ib .ibt span{display:block;font-size:12px;line-height:1.5;color:var(--ink2);margin-top:2px}
#ib .ibgo{flex:none;border:0;border-radius:999px;padding:12px 22px;font:700 14px var(--font-body);color:#fff;background:linear-gradient(135deg,#2B7BA6,#1B3F95);box-shadow:0 6px 16px rgba(27,63,149,.35);cursor:pointer}
#ib .ibx{position:absolute;top:-9px;right:-7px;width:28px;height:28px;border-radius:50%;border:0;padding:0;background:#1A1B1F;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#ib .ibx svg{width:12px;height:12px}
@media (max-width:480px){#ib{padding:12px;gap:10px}#ib .ibt span{display:none}#ib .ibgo{padding:10px 16px}}
@media (prefers-reduced-motion: reduce){#ib{transition:none}}

/* goals + analysis */
.gcard{padding:14px 16px;margin-top:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gh b{font-size:16px}
.gbadge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.gbadge.late{background:var(--warn-bg);color:var(--red)}
.gbadge.ok{background:#DDF3EA;color:#1C7A57}
.gnum{margin-top:8px;font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px}
.gnum em{font-style:normal;font-size:26px;font-weight:700;color:var(--ink)}
.meter.ok i{background:#3FB68B}
.gsub{margin-top:8px;font-size:13px;color:var(--ink2);line-height:1.6}
.grow{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px;align-items:center}
.grow .field{min-width:0}
.gdel{margin-top:10px}
.gdone .gnum em{color:#1C7A57}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--line);margin-top:8px}
.tm{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.tb{display:flex;align-items:flex-end;gap:3px;width:100%;height:100%;justify-content:center}
.tb i{display:block;width:38%;max-width:22px;border-radius:4px 4px 0 0}
.tb i.in,.tleg i.in{background:var(--in)}
.tb i.ex,.tleg i.ex{background:var(--red)}
.tm span{position:absolute;bottom:-22px;font-size:12px;color:var(--ink2)}
.tm span.cur{color:var(--ink);font-weight:700}
.tleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:30px;font-size:12px;color:var(--ink2);align-items:center}
.tleg span{display:inline-flex;align-items:center;gap:6px}
.tleg i{display:inline-block;width:10px;height:10px;border-radius:3px}
.tleg .tavg{margin-left:auto}
.tb.stk{flex-direction:column;justify-content:flex-end;align-items:center;gap:0}
.tb.stk i{width:56%;max-width:30px;border-radius:0}
.tb.stk i.vr{border-radius:4px 4px 0 0}
.tb i.fx,.tleg i.fx{background:var(--bar,#5FA8C8)}
.tb i.vr,.tleg i.vr{background:var(--red)}
.ins{list-style:none;margin:0;padding:0}
.ins li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ins li:last-child{border-bottom:0}
.ins li span{color:var(--ink2)}
.ins li b{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.cmp{margin:2px 0 6px;font-size:14px;line-height:1.7}
.up{color:var(--red);font-weight:700}
.dn{color:var(--in);font-weight:700}
@media (max-width:360px){.grow{grid-template-columns:1fr 1fr}.grow .field{grid-column:1/-1}}

/* search + payment method */
.lsearch{margin-top:12px}
.lfil{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lfil .field{min-width:0}
.lall{margin-top:6px}
.lsum{margin:12px 2px 0;font-size:13px;color:var(--ink2)}
.lsum b{color:var(--ink)}
@media (max-width:360px){.lfil{grid-template-columns:1fr}}

/* modern pass: softer surfaces, deeper card, squircle shortcuts, floating tab bar */
:root{--bg:#F4F5F8;--sh:0 1px 2px rgba(20,24,40,.05),0 10px 28px rgba(20,24,40,.07);--glass:rgba(255,255,255,.84)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D0E12;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--glass:rgba(27,28,33,.84)}}
:root[data-theme="dark"]{--bg:#0D0E12;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--glass:rgba(27,28,33,.84)}
.mark{border-radius:0;background:none;box-shadow:none;display:block;overflow:visible;filter:drop-shadow(0 3px 6px rgba(11,35,88,.35))}
.mark svg{display:block}
.brand{letter-spacing:.12em;font-family:var(--font-num);font-size:16px}
.notice{border-radius:18px;box-shadow:var(--sh)}
.panel,.sumbox,.help{border-radius:20px;box-shadow:var(--sh)}
.ph h2{font-size:15px;letter-spacing:.04em}
.card{border-radius:30px;padding:24px 14px 16px;box-shadow:0 18px 40px rgba(11,35,88,.35);
  background:radial-gradient(120% 80% at 90% -10%,rgba(94,196,222,.55),rgba(94,196,222,0) 55%),linear-gradient(160deg,#16367C 0%,#0B2358 55%,#0A1B45 100%)}
.card::after{inset:auto auto -45% -25%;background:radial-gradient(circle,rgba(229,49,79,.28),rgba(229,49,79,0) 65%)}
.pill{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.pill button{color:#fff}
.bal .big{font-size:50px;letter-spacing:-.01em}
.stats{gap:8px}
.stats>div{border-left:0;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.stats b{font-size:15px}
.ic{width:62px;height:62px;border-radius:22px;box-shadow:var(--sh);transition:transform .15s}
.sc:active .ic{transform:scale(.95)}
.primary{background:linear-gradient(180deg,#E0314E,#B50F2B);box-shadow:0 8px 20px rgba(196,18,47,.32)}
.amtbox{border-radius:16px;box-shadow:var(--sh)}
.days i{border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--bar),color-mix(in srgb,var(--bar) 50%,transparent))}
.days i.z{background:var(--line)}
.days i.td{background:var(--red)}
main{padding-bottom:132px}
.tabs{background:none;border:0;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tabs .in{pointer-events:auto;max-width:480px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.tab{border-radius:20px;padding:6px 0 5px;font-size:11px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:color-mix(in srgb,var(--red) 12%,transparent)}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: reduce){.ic{transition:none}}

/* passcode lock screen */
#lock{position:fixed;inset:0;z-index:90;overflow-y:auto;display:flex;color:#fff;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 90% -10%,rgba(94,196,222,.5),rgba(94,196,222,0) 55%),linear-gradient(160deg,#16367C 0%,#0B2358 55%,#0A1B45 100%)}
#lock .lk{margin:auto;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#lock .logo{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);display:grid;place-items:center}
#lock .logo svg{width:44px;height:44px;display:block}
#lock .nm{font-family:var(--font-num);font-weight:700;font-size:18px;letter-spacing:.14em;margin-bottom:14px}
#lock h2{margin:0;font-size:19px}
#lock .lsub{margin:0;font-size:13px;opacity:.82}
#lock .dots{display:flex;gap:16px;margin:20px 0 6px}
#lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
#lock .dots i.on{background:#fff}
#lock.shake .dots{animation:shake .4s}
#lock .lmsg{min-height:2.6em;margin:0;font-size:13px;font-weight:700;color:#FFD3DA;max-width:30em}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;margin-top:6px}
#lock .pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.13);color:#fff;font-family:var(--font-num);font-size:28px;font-weight:700;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#lock .pad button:active{background:rgba(255,255,255,.28)}
#lock .pad button:focus-visible{outline-color:#fff}
#lock .lbot{display:flex;flex-direction:column;gap:2px;margin-top:14px}
#lock .lbot button{background:none;border:0;color:#fff;font-size:14px;padding:8px 12px;text-decoration:underline;text-underline-offset:3px;opacity:.9}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){#lock.shake .dots{animation:none}}
@media (max-height:640px){#lock .pad button{width:60px;height:60px;font-size:24px}#lock .pad{grid-template-columns:repeat(3,60px);gap:10px 20px}}

/* calculator */
.calc-t{align-self:center;flex:none;border:0;background:var(--chip);color:var(--ink);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;padding:0}
.calc-t svg{width:24px;height:24px}
.calc-t[aria-pressed="true"]{background:var(--btn);color:#fff}
.calc{background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:12px;margin-top:8px}
.cdisp{text-align:right;padding:4px 6px 10px;min-height:68px;overflow-wrap:anywhere}
.cexpr{font-size:26px;font-weight:700;line-height:1.25}
.cres{font-family:var(--font-num);font-size:15px;color:var(--ink2);min-height:1.5em;font-variant-numeric:tabular-nums}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ckeys button{height:50px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font-family:var(--font-num);font-size:21px;font-weight:700;padding:0}
.ckeys button:active{opacity:.7}
.ckeys .o,.ckeys .f{color:var(--red)}
.ckeys .eq{background:var(--btn);color:#fff}
.ckeys .use{background:var(--in);color:#fff;font-size:14px;font-family:var(--font-body)}
.ckeys .w2{grid-column:span 2}

/* tasks */
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink2);background:none;display:grid;place-items:center;padding:0;color:#fff}
.chk.on{background:var(--in);border-color:var(--in)}
.chk svg{width:18px;height:18px;stroke-width:2.8}
.row.dn .cat{text-decoration:line-through;color:var(--ink2)}
.stag.late{background:var(--warn-bg);color:var(--red)}
.stag.now{background:var(--info-bg);color:var(--in)}
.tact{display:flex;flex-direction:column;align-items:flex-end}
.tform{padding-block:12px}
.trow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tform label{margin-top:4px}
.backl{display:flex;align-items:center;gap:2px;margin:0 0 10px -6px;background:none;border:0;color:var(--red);font-weight:700;font-size:14px;padding:4px 6px}
.backl svg{width:18px;height:18px}

/* tasks (modern) */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.v-tasks .tk-hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#2B7BA6 0%,#1B3F95 60%,#0B2358 100%);box-shadow:0 14px 32px rgba(27,63,149,.28);position:relative;overflow:hidden}
.v-tasks .tk-hero:after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.tk-ring{position:relative;width:72px;height:72px;flex:none}
.tk-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tk-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.tk-ring .bg{stroke:rgba(255,255,255,.22)}
.tk-ring .fg{stroke:#fff;transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.tk-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1;font-family:var(--font-num);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.tk-ring b small{font-size:10px;margin:5px 0 0 1px;opacity:.85}
.tk-hl{min-width:0;position:relative;z-index:1}
.tk-h1{font-size:20px;font-weight:800;line-height:1.3}
.tk-h2{font-size:13px;opacity:.85;margin-top:2px}
.tk-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tk-st{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.tk-st span{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.tk-st b{display:block;font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tk-st b small{font-size:12px;font-weight:600;color:var(--ink2);margin-left:2px}
.tk-st.warn b{color:var(--red)}
.tk-new{background:var(--surface);border-radius:22px;padding:14px;margin-top:10px;box-shadow:var(--sh)}
.tk-new .tform{padding:0}
.tk-in{display:flex;gap:8px;align-items:center}
.tk-in .field{flex:1;min-width:0;border-radius:999px;padding-inline:18px;background:var(--bg)}
.tk-add{flex:none;width:46px;height:46px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;padding:0;background:linear-gradient(180deg,#E0314E,#B50F2B);box-shadow:0 8px 18px rgba(196,18,47,.3)}
.tk-add svg{width:22px;height:22px;stroke-width:2.4}
.tk-add:active{transform:scale(.94)}
.tk-qd{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.tk-qd button{border:1px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700}
.tk-qd button[aria-pressed="true"]{background:color-mix(in srgb,var(--in) 14%,var(--surface));border-color:var(--in);color:var(--in)}
.v-tasks .trow2 .field{background:var(--bg);border-radius:14px}
.v-tasks .c2 .seg{margin-top:0}
.tk-gh{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ink2)}
.tk-gh i{font-style:normal;font-size:11px;background:var(--chip);border-radius:999px;padding:1px 8px;font-family:var(--font-num)}
.tk-gh.late{color:var(--red)}.tk-gh.late i{background:var(--warn-bg);color:var(--red)}
.tk-gh.today{color:var(--in)}.tk-gh.today i{background:var(--info-bg);color:var(--in)}
.tk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tk{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 12px 12px 14px;box-shadow:var(--sh);border-left:4px solid transparent;transition:transform .15s,box-shadow .15s,opacity .2s}
.tk.late{border-left-color:var(--red)}
.tk.dn{opacity:.6}
.tk.dn .tk-ttl{text-decoration:line-through;color:var(--ink2)}
.tk .chk{width:26px;height:26px;border-color:color-mix(in srgb,var(--ink2) 70%,transparent);transition:background .15s,border-color .15s,transform .15s}
.tk .chk:active{transform:scale(.88)}
.tk-body{flex:1;min-width:0}
.tk-ttl{font-weight:700;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.tk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tk-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--ink2);font-variant-numeric:tabular-nums}
.tk-chip svg{width:12px;height:12px}
.tk-chip.late{background:var(--warn-bg);color:var(--red)}
.tk-chip.now{background:var(--info-bg);color:var(--in)}
.tk-chip.amt{background:color-mix(in srgb,var(--bar) 14%,var(--surface));color:var(--bar)}
.tk-chip.mute{background:transparent;padding-left:0;font-weight:600}
.tk-act{display:flex;align-items:center;gap:6px;flex:none}
.tk-new .err:empty{display:none}
.tk-pay{display:inline-flex;align-items:center;gap:2px;border:0;border-radius:999px;background:color-mix(in srgb,var(--in) 14%,var(--surface));color:var(--in);font-size:11.5px;font-weight:800;padding:2px 8px 2px 10px;white-space:nowrap}
.tk-pay svg{width:12px;height:12px;stroke-width:2.6}
.tk-del{border:0;background:none;color:var(--ink2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:12px;font-weight:700}
.tk-del svg{width:18px;height:18px}
.tk-del.arm{width:auto;padding:0 12px;border-radius:999px;background:var(--warn-bg);color:var(--red)}
.tk-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-top:14px;padding:34px 18px;background:var(--surface);border-radius:22px;box-shadow:var(--sh);color:var(--ink2);font-size:13.5px}
.tk-empty b{color:var(--ink);font-size:16px}
.tk-eic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px;background:color-mix(in srgb,var(--in) 12%,var(--surface));color:var(--in)}
.tk-eic svg{width:26px;height:26px}
@media (hover:hover){.tk:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,24,40,.06),0 14px 30px rgba(20,24,40,.1)}.tk-del:hover{background:var(--chip)}.tk-qd button:hover{border-color:var(--in)}.tk-pay:hover{filter:brightness(.95)}}
@media (prefers-reduced-motion:reduce){.tk,.tk-ring .fg,.tk .chk{transition:none}}

/* goals (modern) */
.v-goals .gk-hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,#1F9E8A 0%,#2B7BA6 48%,#1B3F95 100%);box-shadow:0 14px 32px rgba(27,63,149,.26)}
.v-goals .gk-hero:after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 70%);pointer-events:none}
.v-goals .gk-hero .t{position:relative;z-index:1}
.v-goals .gk-hero .t small{color:rgba(255,255,255,.82)}
.v-goals .gk-hero .meter{background:rgba(255,255,255,.22);position:relative;z-index:1}
.v-goals .gk-hero .meter i{background:#fff}
.gk-hs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.gk-hs span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
.gk-hs b{font-family:var(--font-num);font-size:13px;font-variant-numeric:tabular-nums}
.v-goals .gk{padding:16px;margin-top:12px;border:0}
.gk-top{display:flex;gap:14px;align-items:center}
.gk-ring{position:relative;width:72px;height:72px;flex:none}
.gk-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gk-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.gk-ring .bg{stroke:var(--chip)}
.gk-ring .fg{stroke:var(--bar);transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)}
.gk.gdone .gk-ring .fg{stroke:#3FB68B}
.gk.glate .gk-ring .fg{stroke:var(--red)}
.gk-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1;font-family:var(--font-num);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.gk-ring b small{font-size:10px;margin:4px 0 0 1px;color:var(--ink2);font-weight:700}
.gk-info{flex:1;min-width:0}
.gk-info .gh b{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.gk-info .gnum{margin-top:4px}
.gk-info .gnum em{font-size:24px;font-weight:800}
.gk-left{font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:1px}
.v-goals .gbadge.ok{background:color-mix(in srgb,#3FB68B 18%,var(--surface));color:#1C8A62}
.v-goals .gdone .gnum em{color:#1C8A62}
.gk-ins{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gk-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--in) 12%,var(--surface));color:var(--in)}
.gk-chip svg{width:12px;height:12px;stroke-width:2.6}
.gk-chip.pace{background:var(--chip);color:var(--ink2)}
.gk-chip.late{background:var(--warn-bg);color:var(--red)}
.gk-chip.ok{background:color-mix(in srgb,#3FB68B 18%,var(--surface));color:#1C8A62}
.gk-q,.gk-qn{display:flex;gap:6px;flex-wrap:wrap}
.gk-q{margin-top:14px}
.gk-qn{margin:8px 0 6px}
.gk-q button,.gk-qn button{border:1px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.gk-qn button[aria-pressed="true"]{background:color-mix(in srgb,var(--in) 14%,var(--surface));border-color:var(--in);color:var(--in)}
.v-goals .gk .grow{margin-top:10px;grid-template-columns:1fr auto auto}
.v-goals .gk .grow .field{border-radius:999px;padding-inline:16px;background:var(--bg)}
.gk-dep,.gk-wd{min-height:46px;border-radius:999px;font-weight:800;font-size:13.5px;padding:0 16px;white-space:nowrap}
.gk-dep{border:0;color:#fff;background:linear-gradient(180deg,#3E9BC4,#1F6FB5);box-shadow:0 8px 18px rgba(31,111,181,.28)}
.gk-dep:active{transform:scale(.97)}
.gk-wd{border:1px solid var(--line);background:none;color:var(--ink2)}
.v-goals .gk .gdel{display:flex;align-items:center;gap:4px;margin:12px 0 0 auto;background:none;border:0;color:var(--ink2);font-size:12px;font-weight:600;padding:6px 8px;border-radius:999px}
.v-goals .gk .gdel svg{width:15px;height:15px}
.v-goals .gk .gdel.arm{background:var(--warn-bg);color:var(--red);font-weight:800}
.gk-new{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.gk-nh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gk-nh b{display:block;font-size:16px}
.gk-nh small{color:var(--ink2);font-size:12.5px}
.gk-nic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,#3E9BC4,#1B3F95)}
.gk-nic svg{width:20px;height:20px;stroke-width:2.4}
.gk-new .tform{padding:0}
.gk-new .tform label{display:block;margin:0 0 6px 2px;font-size:13px;font-weight:700}
.gk-new .tform>.gk-qn{margin:10px 0 18px}
.gk-new .tform>.trow2{margin:0 0 18px;gap:10px}
.gk-new .tform>label[for="gdue"]{margin-top:0}
.gk-new .tform>.gk-qn:last-of-type{margin-bottom:12px}
.gk-new .field{background:var(--bg);border-radius:14px}
.gk-new .err:empty{display:none}

@media (hover:hover){.gk{transition:transform .15s,box-shadow .15s}.gk:hover{transform:translateY(-1px)}.gk-q button:hover,.gk-qn button:hover{border-color:var(--in);color:var(--in)}.gk-wd:hover{background:var(--chip)}.v-goals .gk .gdel:hover{background:var(--chip)}}

/* report preview */
.pages{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.pg{margin:0}
.pg img{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:var(--sh)}
.pg figcaption{text-align:center;font-size:12px;color:var(--ink2);margin-top:4px}

.pcact{display:contents}

  main{padding-top:20px;padding-bottom:56px}

  button.tab.pc-only{display:flex}

async function init(){
  render();

  try{
    if(window.claude&&window.claude.use){
      var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      var db=r[0],user=r[1];

      if(db&&uid){col=db.collection('data/users/'+uid);ok=true;}
    }else{
      FB=await fbBoot();
      var fu=await fbUser(FB.auth);
      if(fu){col=FB.fs.collection('users/'+fu.uid+'/items');S.fbUser=fu;ok=true;}
    }
  }catch(e){ok=false;col=null;}
  if(!ok){S.mode='local';lsLoad();sortTx();S.ready=true;render();runRecs();return;}
  S.mode='db';
  var timer=setTimeout(function(){S.slow=true;softRender();},10000);
  col.onSnapshot(function(snap){
    if(S.fbUser&&snap.empty&&!snap.metadata.fromCache&&!S.migTried){S.migTried=true;fbMigrate();}
    var list=[],tl=[],rl=[],gl=[],ll=[],bl=[],cll=[],tpv=[],plv=[],bud=null,pys=null,xfv=[],sbv=[];
    snap.docs.forEach(function(d){
      var v=d.data()||{};
      if(d.id==='cfg'){bud=v.budgets||{};pys=Array.isArray(v.pays)?v.pays:null;bl=Array.isArray(v.bal)?v.bal:[];cll=Array.isArray(v.cl)?v.cl:[];tpv=Array.isArray(v.tpl)?v.tpl:[];plv=Array.isArray(v.plan)?v.plan:[];xfv=Array.isArray(v.xf)?v.xf:[];sbv=Array.isArray(v.subs)?v.subs:[];}
      else if(v.k==='task'){tl.push(Object.assign({id:d.id},v));}

/* ---------- recurring expenses ---------- */
function dimOf(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();}
function recDate(m,day){return m+'-'+pad(Math.min(day,dimOf(m)));}
function recNext(r){
  var m=r.last?shift(r.last,1):r.from;
  return recDate(m,r.day);
}
function addRec(r){
  if(col){return col.add(Object.assign({k:'rec'},r)).catch(fail);}
  S.recs.push(Object.assign({id:newId(),k:'rec'},r));lsSave();return Promise.resolve();
}
function saveRec(r){
  if(col){var o=Object.assign({},r);delete o.id;return col.doc(r.id).set(o).catch(fail);}
  lsSave();return Promise.resolve();
}
function delRec(id){
  if(col){return col.doc(id).delete().catch(fail);}
  S.recs=S.recs.filter(function(x){return x.id!==id;});lsSave();return Promise.resolve();
}
async function runRecs(){
  try{await runSubs();}catch(err){}
  var made=0,cur=TODAY.slice(0,7);
  for(var i=0;i<S.recs.length;i++){
    var r=S.recs[i],m=r.last?shift(r.last,1):r.from,guard=0,changed=false;
    while(m<=cur&&guard<36){
      var d=recDate(m,r.day);
      if(d>TODAY)break;
      var dup=S.txs.some(function(t){return t.rec===r.id&&t.d.slice(0,7)===m;});
      if(!dup){await addTx({d:d,t:r.t==='in'?'in':'out',c:r.c,a:r.a,m:r.m||'',p:r.p||'',rec:r.id,ts:Date.now()+made});made++;}
      r.last=m;changed=true;m=shift(m,1);guard++;
    }
    if(changed)await saveRec(r);
  }
  if(made){toast('定期の記録を'+made+'件追加しました');if(S.tab!=='add')softRender();}
}

function bkGuess(t,memo){
  var s=String(memo||'').normalize('NFKC');
  if(t==='in'){
    if(/給与|給料|salary|サラリー|キユウヨ|キュウヨ/i.test(s))return '給与';
    if(/賞与|ボーナス|ショウヨ|シヨウヨ/i.test(s))return '賞与';
    if(/利息|配当|報酬|売上|メルカリ|ラクマ|還付|キャッシュバック/i.test(s))return '副収入';
    return 'その他';
  }
  for(var i=0;i<BK_OUT.length;i++){if(BK_OUT[i][1].test(s))return BK_OUT[i][0];}
  return 'その他';
}
function bankFinish(all,bad){
  var seen={};S.txs.forEach(function(t){var k=[t.d,t.t,t.a,t.m||''].join('|');seen[k]=(seen[k]||0)+1;});
  var rows=[],dup=0;
  all.forEach(function(x){
    var k=[x.d,x.t,x.a,x.m].join('|');
    if(seen[k]>0){seen[k]--;dup++;return;}
    rows.push({d:x.d,t:x.t,c:bkGuess(x.t,x.m),a:x.a,m:x.m,p:'',ts:Date.now()});
  });
  return {rows:rows,dup:dup,bad:bad,bank:true,all:all,pay:''};
}
function bankFlip(){
  var n=S.csvImp;if(!n||!n.bank)return;
  n.all.forEach(function(x){x.t=x.t==='in'?'out':'in';});
  var f=bankFinish(n.all,n.bad);f.pay=n.pay;f.det=n.det;S.csvImp=f;
}
function bankParse(text){
  var rows=csvRows(text),n=rows.length,hi=-1,i,j,card=false;
  var RD=/日付|年月日|利用日|取引日|date|^日$/i,RA=/金額|出金|入金|引出|預入|支払|お預|利用額|請求|debit|credit|amount|withdraw|deposit/i;
  for(i=0;i<Math.min(n,20);i++){
    var r0=rows[i];
    if(r0.some(function(c){return RD.test(String(c).trim());})&&r0.some(function(c){return RA.test(String(c).trim());})){hi=i;break;}
  }
  var col={d:-1,m:-1,o:-1,n:-1,a:-1,k:-1};
  if(hi>=0){
    rows[hi].forEach(function(h,j){
      h=String(h).trim();
      if(col.d<0&&RD.test(h))col.d=j;
      else if(/残高|balance/i.test(h)){}
      else if(col.k<0&&/入出金|区分|収支|取引種別|種別/.test(h))col.k=j;
      else if(col.o<0&&/出金|引出|払戻|お支払|支払金額|支払額|debit|withdraw/i.test(h))col.o=j;
      else if(col.n<0&&/入金|預入|お預|受取|credit|deposit/i.test(h))col.n=j;
      else if(col.a<0&&/金額|利用額|請求|amount/i.test(h)){col.a=j;card=/利用|請求/.test(h);}
      else if(col.m<0&&/摘要|内容|利用店|ご利用先|店名|利用先|取引先|支払先|名称|備考|メモ|詳細|description|payee/i.test(h))col.m=j;
    });
  }else{
    for(i=0;i<n&&hi<0;i++){
      var rr=rows[i],dj=-1;
      for(j=0;j<rr.length;j++){if(bkDate(rr[j])){dj=j;break;}}
      if(dj<0)continue;
      col.d=dj;
      for(j=dj+1;j<rr.length;j++){if(bkAmt(rr[j])!==null&&!bkDate(rr[j])){col.a=j;break;}}
      if(col.a<0)continue;
      hi=i-1;
    }
  }
  if(col.d<0||(col.o<0&&col.n<0&&col.a<0))return bankFinish([],0);
  var all=[],bad=0;
  for(i=hi+1;i<n;i++){
    var r=rows[i],d=bkDate(r[col.d]);
    if(!d){if(r.filter(function(c){return String(c).trim()!=='';}).length>=3)bad++;continue;}
    var ov=col.o>=0?bkAmt(r[col.o]):null,iv=col.n>=0?bkAmt(r[col.n]):null,av=col.a>=0?bkAmt(r[col.a]):null,ty='',a=0;
    if(ov){ty='out';a=Math.abs(ov);}
    else if(iv){ty='in';a=Math.abs(iv);}
    else if(av){
      var dir=col.k>=0?bkDir(r[col.k]):'';
      a=Math.abs(av);
      if(dir)ty=dir;
      else if(card)ty=av>0?'out':'in';
      else ty=av<0?'out':'in';
    }
    if(!ty||!a||a>99999999){bad++;continue;}
    var m=col.m>=0?String(r[col.m]||''):'';
    if(!m.trim()){
      for(j=0;j<r.length;j++){
        if(j===col.d||j===col.o||j===col.n||j===col.a||j===col.k)continue;
        var c=String(r[j]||'').trim();
        if(c&&bkAmt(c)===null&&!bkDate(c)){m=c;break;}
      }
    }
    m=m.normalize('NFKC').replace(/\s+/g,' ').trim().slice(0,40);
    all.push({d:d,t:ty,a:a,m:m});
  }
  return bankFinish(all,bad);
}

  return h;

function goalInfo(g){
  var tg=+g.target||0,sv=Math.max(0,+g.saved||0),done=tg>0&&sv>=tg;
  var i={tg:tg,sv:sv,done:done,pct:tg>0?Math.min(100,sv/tg*100):0,left:Math.max(0,tg-sv),need:0,late:false,mleft:0,eta:''};
  var cur=TODAY.slice(0,7);
  if(g.due&&!done){
    var mm=(+g.due.slice(0,4)-+cur.slice(0,4))*12+(+g.due.slice(5,7)-+cur.slice(5,7));
    i.mleft=mm;i.late=mm<0;i.need=Math.ceil(i.left/Math.max(1,mm+1));
  }
  if(!done&&i.left>0){
    var log=g.log||[],from=shift(cur,-2),sum=0,first='';
    log.forEach(function(x){if(x.d&&x.d.slice(0,7)>=from){sum+=+x.a||0;if(!first||x.d<first)first=x.d;}});
    if(sum>0){
      var span=Math.min(3,Math.max(1,(+cur.slice(0,4)-+first.slice(0,4))*12+(+cur.slice(5,7)-+first.slice(5,7))+1));
      var avg=sum/span,n=Math.ceil(i.left/avg);
      if(n>0&&n<=600){var em=shift(cur,n);i.eta=em.slice(0,4)+'年'+(+em.slice(5,7))+'月ごろ';i.avg=Math.round(avg);}
    }
  }
  return i;
}
function goalMove(id,sign){
  var g=S.goals.find(function(x){return x.id===id;}),inp=document.getElementById('gi-'+id);
  if(!g||!inp)return;
  var raw=norm(inp.value);
  if(!/^\d+$/.test(raw)||+raw<=0||+raw>99999999){toast('金額は1円以上の数字で入力してください');inp.focus();return;}
  var a=+raw,have=Math.max(0,+g.saved||0);
  if(sign<0){if(have<=0){toast('取り崩せる金額がありません');return;}a=Math.min(a,have);}
  var was=goalInfo(g).done;
  g.saved=Math.max(0,have+sign*a);
  g.log=(g.log||[]).concat([{d:TODAY,a:sign*a}]).slice(-60);
  saveGoal(g).then(function(){
    var now=goalInfo(g).done;render();
    toast(now&&!was?'「'+g.name+'」を達成しました!おめでとうございます':(sign>0?yen(a)+'円を積み立てました':yen(a)+'円を取り崩しました'));
  });
}

function addDays(d,n){var x=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function cardStatements(p){
  if(!p.card||!p.close||!p.pay)return [];
  var cur=TODAY.slice(0,7),out=[];
  for(var k=-3;k<=1;k++){
    var m=shift(cur,k),cd=recDate(m,p.close),pd=recDate(shift(m,p.off),p.pay);
    if(pd<TODAY)continue;
    var start=addDays(recDate(shift(m,-1),p.close),1),amt=0,n=0;
    S.txs.forEach(function(t){if(t.t==='out'&&t.p===p.name&&t.d>=start&&t.d<=cd){amt+=t.a;n++;}});
    out.push({close:cd,start:start,pay:pd,amt:amt,n:n,open:cd>=TODAY});
  }
  return out.filter(function(x){return x.amt>0||x.open;}).slice(0,2);
}
function md(d){return (+d.slice(5,7))+'/'+(+d.slice(8,10));}
function cardDueHtml(){
  var rows=[];
  S.pays.forEach(function(p){
    cardStatements(p).forEach(function(x){
      if(!(x.amt>0))return;
      rows.push('<div class="crow"><div class="h"><b>'+esc(p.name)+' · '+md(x.pay)+'引き落とし'+(p.acct?'('+esc(p.acct)+')':'')+'</b><span><em>'+mask(yen(x.amt))+'</em>円</span></div><div class="gsub">利用 '+md(x.start)+'〜'+md(x.close)+(x.open?'(締め日前のため、増える場合があります)':'')+' · '+x.n+'件</div></div>');
    });
  });
  if(!rows.length)return '';
  return '<div class="ph"><h2>カードの引き落とし</h2></div><section class="panel">'+rows.join('')+'</section>';
}

}

/* ---------- calculations ---------- */
function calc(m){
  var rows=S.txs.filter(function(t){return t.d.slice(0,7)===m;});
  var inc=0,exp=0,cat={},day={};
  rows.forEach(function(t){
    if(t.t==='in'){inc+=t.a;}
    else{exp+=t.a;cat[t.c]=(cat[t.c]||0)+t.a;var dd=+t.d.slice(8,10);day[dd]=(day[dd]||0)+t.a;}
  });
  var bud=OUT.reduce(function(s,c){return s+(+S.budgets[c]||0);},0);
  return {rows:rows,inc:inc,exp:exp,cat:cat,day:day,bud:bud,remain:bud-exp};
}

/* ---------- month-end spending forecast ---------- */
var FC_LUMPY=['住居','水道光熱','通信','サブスク'];
function fcCalc(){
  var cur=TODAY.slice(0,7),dim=dimOf(cur),el=Math.max(1,+TODAY.slice(8,10)),rem=Math.max(0,dim-el),c=calc(cur);
  var hist=[],i;
  for(i=1;i<=3;i++){(function(mo){if(S.txs.some(function(t){return t.d.slice(0,7)===mo;}))hist.push(mo);})(shift(cur,-i));}
  var cats={};
  function cg(k){return cats[k]||(cats[k]={sp:0,spVar:0,pend:0,hv:0,ht:0,rec:false,exp:0,fin:0});}
  OUT.forEach(cg);
  S.txs.forEach(function(t){
    if(t.t==='in')return;
    var m=t.d.slice(0,7),o=cg(t.c||'その他');
    if(m===cur){o.sp+=t.a;if(!t.rec)o.spVar+=t.a;}
    else if(hist.indexOf(m)>=0){o.ht+=t.a;if(!t.rec)o.hv+=t.a/dimOf(m);}
  });
  var pendIn=0;
  S.recs.forEach(function(r){
    if(r.t!=='in')cg(r.c).rec=true;
    if(r.from>cur)return;
    if(r.last&&r.last>=cur)return;
    if(recDate(cur,r.day)<=TODAY)return;
    if(S.txs.some(function(t){return t.rec===r.id&&t.d.slice(0,7)===cur;}))return;
    if(r.t==='in')pendIn+=r.a;else cg(r.c).pend+=r.a;
  });
  var w=Math.min(1,el/dim),varRem=0,pendRec=0,total=0;
  Object.keys(cats).forEach(function(k){
    var o=cats[k],n=hist.length;
    if(FC_LUMPY.indexOf(k)>=0){
      o.exp=(o.rec||!n)?0:Math.max(0,o.ht/n-o.sp-o.pend);
    }else{
      var prior=n?o.hv/n:(+S.budgets[k]||0)/dim;
      o.exp=(w*(o.spVar/el)+(1-w)*prior)*rem;
      varRem+=o.exp;
    }
    pendRec+=o.pend;
    o.fin=Math.round(o.sp+o.pend+o.exp);
  });
  var tsk=0,pl=0;
  S.tasks.forEach(function(t){if(!t.done&&t.amt&&t.due&&t.due.slice(0,7)===cur)tsk+=+t.amt;});
  S.plan.forEach(function(x){if(!x.done&&x.k!=='in'&&x.m===cur)pl+=x.a;});
  Object.keys(cats).forEach(function(k){total+=cats[k].fin;});
  total+=tsk+pl;
  var fixed=pendRec+tsk+pl,conf=(hist.length>=2||el>=20)?'高':((hist.length>=1||el>=10)?'中':'低'),sp=(conf==='高'?.2:.35)*varRem;
  return {cur:cur,dim:dim,el:el,rem:rem,c:c,cats:cats,hist:hist.length,total:Math.round(total),low:Math.round(Math.max(c.exp+fixed,total-sp)),high:Math.round(total+sp),varRem:varRem,pendRec:pendRec,pendIn:pendIn,tsk:tsk,pl:pl,conf:conf,spent:c.exp,bud:c.bud};
}
function forecastHtml(){
  if(!S.ready||S.month!==TODAY.slice(0,7))return '';
  var f=fcCalc();
  if(!f.c.rows.length&&!f.hist)return '';
  var diff=f.bud-f.total,sc=Math.max(f.total,f.bud,1)*1.04;
  var spW=f.spent/sc*100,toW=Math.max(0,f.total-f.spent)/sc*100,bx=f.bud/sc*100;
  var state;
  if(f.bud<=0)state='予算が未設定のため、見込み額だけを表示しています。';
  else if(diff>=0)state='このペースなら予算内に収まりそうです(あと約'+mask(yen(diff))+'円の余裕)。';
  else state='このペースだと予算を約'+mask(yen(-diff))+'円超えそうです。';
  var room=f.bud-(f.total-f.varRem),per=f.rem>0?Math.floor(room/f.rem):null,tip='';
  if(f.bud>0&&f.rem>0)tip=room>0?'予算内に収めるには、残り'+f.rem+'日の変動費を1日あたり約'+mask(yen(per))+'円までに。':'定期の支払いなどを除くと、変動費に回せる予算はもう残っていません。';
  var over=Object.keys(f.cats).map(function(k){var b=+S.budgets[k]||0;return {k:k,b:b,v:f.cats[k].fin,d:f.cats[k].fin-b};}).filter(function(x){return x.b>0&&x.d>0;}).sort(function(a,b){return b.d-a.d;});
  var h='<div class="ph"><h2>月末の支出予測</h2><button class="link" data-act="fctoggle">'+(S.fcOpen?'閉じる':'内訳')+'</button></div><section class="panel" style="padding-block:12px">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end"><div><div style="font-size:12px;color:var(--ink2)">'+(+f.cur.slice(5,7))+'月末の見込み</div><div style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums">'+mask(yen(f.total))+'<span style="font-size:14px;font-weight:600">円</span></div></div><div style="text-align:right;font-size:12px;color:var(--ink2)">目安 '+mask(yen(f.low)+'〜'+yen(f.high))+'円<br>確度 '+f.conf+'</div></div>';
  h+='<div class="meter" style="position:relative;margin-top:12px" role="img" aria-label="支出の現在額と月末見込みと予算"><i style="position:absolute;left:0;top:0;width:'+Math.min(100,spW+toW).toFixed(1)+'%;background:var(--bar);opacity:.35"></i><i style="position:absolute;left:0;top:0;width:'+Math.min(100,spW).toFixed(1)+'%;background:'+(f.spent>f.bud&&f.bud>0?'var(--red)':'var(--bar)')+'"></i>'+(f.bud>0?'<span style="position:absolute;top:-2px;bottom:-2px;left:'+Math.min(99.5,bx).toFixed(1)+'%;width:2px;background:var(--ink)"></span>':'')+'</div>';

function catSuggest(memo,type){
  var m=norm(memo||'').trim().toLowerCase();if(!m)return null;
  var cats=type==='in'?INC:OUT,score={},best=null,bv=0;
  S.txs.forEach(function(t){if(t.t!==type||!t.m)return;var pm=String(t.m).toLowerCase();
    if(pm===m)score[t.c]=(score[t.c]||0)+3;
    else if(m.length>=2&&(pm.indexOf(m)>=0||(pm.length>=2&&m.indexOf(pm)>=0)))score[t.c]=(score[t.c]||0)+1;});
  Object.keys(score).forEach(function(k){if(cats.indexOf(k)>=0&&score[k]>bv){bv=score[k];best=k;}});
  if(best)return {c:best,why:'過去の記録から'};
  var dict=type==='in'?KW_IN:KW_OUT,ks=Object.keys(dict);
  for(var i=0;i<ks.length;i++){if(dict[ks[i]].some(function(w){return m.indexOf(w)>=0;}))return {c:ks[i],why:'キーワードから'};}
  return null;
}

function balGet(n){return S.bal.find(function(x){return x.n===n;})||null;}
function acctBal(b,upto){var v=b.a;S.txs.forEach(function(t){if(t.p===b.n&&t.d>=b.d&&(!upto||t.d<=upto))v+=t.t==='in'?t.a:-t.a;});return v+xferDelta(b,upto)+cardDelta(b,upto);}
function xferDelta(b,upto){var v=0;S.xf.forEach(function(x){if(x.d<b.d||(upto&&x.d>upto))return;if(x.to===b.n)v+=x.a;if(x.from===b.n)v-=x.a;});return v;}
function cardPayments(p,from,to){
  var out=[];if(!p.card||!p.close||!p.pay||from>to)return out;
  var end=to.slice(0,7),m=shift(from.slice(0,7),-3),g=0;
  for(;m<=end&&g<240;m=shift(m,1),g++){
    var cd=recDate(m,p.close),pd=recDate(shift(m,p.off),p.pay);
    if(pd<from||pd>to)continue;
    out.push({start:addDays(recDate(shift(m,-1),p.close),1),close:cd,pay:pd});
  }
  return out;
}
function cardDelta(b,upto){
  var v=0,lim=upto||TODAY;
  S.pays.forEach(function(p){
    if(!p.card||!p.acct)return;
    var isBank=p.acct===b.n,isCard=p.name===b.n;
    if(!isBank&&!isCard)return;
    cardPayments(p,b.d,lim).forEach(function(s){
      var amt=0;
      S.txs.forEach(function(t){if(t.t==='out'&&t.p===p.name&&t.d>=s.start&&t.d<=s.close&&(isBank||t.d>=b.d))amt+=t.a;});
      if(isBank)v-=amt;else v+=amt;
    });
  });
  return v;
}

    }

  if(n.pays&&n.pays.length){

/* ---------- passcode lock ---------- */
var PK='stera-pass-v1',SK='stera-lock-skip',lockEl=document.getElementById('lock');
var L={st:'',buf:'',first:'',purpose:'',cancel:false,canSkip:false,msg:'',fails:0,until:0};
function pget(){try{return JSON.parse(localStorage.getItem(PK)||'null');}catch(e){return null;}}
function pput(v){try{if(v){localStorage.setItem(PK,JSON.stringify(v));}else{localStorage.removeItem(PK);}return true;}catch(e){return false;}}
function hashOf(code,salt){
  try{
    var data=new TextEncoder().encode(salt+':'+code);
    return crypto.subtle.digest('SHA-256',data).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');});
  }catch(e){
    var h=5381,t=salt+':'+code;for(var i=0;i<t.length;i++){h=((h<<5)+h+t.charCodeAt(i))|0;}
    return Promise.resolve('d'+h);
  }
}
function verifyCode(code){var p=pget();if(!p)return Promise.resolve(false);return hashOf(code,p.s).then(function(h){return h===p.h;});}
var HAS=!!pget();
var TITLES={enter:['パスコードを入力','ロックを解除します'],verify:['現在のパスコードを入力','変更・解除の前に確認します'],set1:['パスコードを設定','4桁の数字を決めてください'],set2:['もう一度入力','確認のため同じ数字を入力してください']};
function dots(){var d=lockEl.querySelector('.dots');if(!d)return;var h='';for(var i=0;i<4;i++){h+='<i class="'+(i<L.buf.length?'on':'')+'"></i>';}d.innerHTML=h;d.setAttribute('aria-label',L.buf.length+'桁入力済み');}
function drawLock(){
  var T=TITLES[L.st],keys='';
  [1,2,3,4,5,6,7,8,9].forEach(function(k){keys+='<button data-k="'+k+'" aria-label="'+k+'">'+k+'</button>';});
  keys+='<span></span><button data-k="0" aria-label="0">0</button><button data-k="back" aria-label="1文字消す">⌫</button>';
  var links='';
  if(L.st==='enter'){links+='<button data-l="forgot">パスコードを忘れたとき</button>';}
  if(L.st==='set1'&&L.canSkip){links+='<button data-l="skip">今はスキップ</button>';}
  if(L.cancel){links+='<button data-l="cancel">キャンセル</button>';}
  lockEl.innerHTML='<div class="lk"><div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true"><g transform="translate(24 25) scale(1.12) translate(-24 -24)"><g><rect x="15.5" y="11" width="16" height="10" rx="2.2" fill="#F6C453" transform="rotate(-8 23.5 16)"/></g><rect x="10.5" y="17" width="27" height="19.5" rx="4.6" fill="#fff"/><rect x="27.5" y="22.6" width="12" height="8.6" rx="3.4" fill="#2767A0"/><circle cx="32.4" cy="26.9" r="1.9" fill="#fff"/></g></svg></div><div class="nm">STERA BANK</div><h2>'+T[0]+'</h2><p class="lsub">'+T[1]+'</p><div class="dots" role="img"></div><p class="lmsg" role="alert">'+esc(L.msg)+'</p><div class="pad">'+keys+'</div><div class="lbot">'+links+'</div></div>';
  dots();
}
function showLock(st,o){o=o||{};L.st=st;L.buf='';L.first='';L.msg='';L.purpose=o.purpose||'';L.cancel=!!o.cancel;L.canSkip=!!o.canSkip;lockEl.hidden=false;drawLock();}
function hideLock(){lockEl.hidden=true;L.st='';lockEl.innerHTML='';}
function shake(){SFX.play('err');lockEl.classList.add('shake');setTimeout(function(){lockEl.classList.remove('shake');},420);}
function press(d){
  if(L.until>Date.now()||L.buf.length>=4)return;
  L.buf+=d;dots();
  if(L.buf.length===4){submitCode();}
}
function submitCode(){
  var code=L.buf;
  if(L.st==='set1'){L.first=code;L.buf='';L.st='set2';L.msg='';drawLock();return;}
  if(L.st==='set2'){
    if(code!==L.first){L.msg='一致しませんでした。最初からやり直してください。';L.st='set1';L.buf='';L.first='';shake();drawLock();return;}
    var salt=Math.random().toString(36).slice(2);
    hashOf(code,salt).then(function(h){
      if(pput({h:h,s:salt})){
        HAS=true;try{localStorage.removeItem(SK);}catch(e){}
        hideLock();toast('パスコードを設定しました');if(S.tab==='menu')render();
      }else{L.msg='この環境では保存できませんでした。';L.st='set1';L.buf='';L.canSkip=true;drawLock();}
    });
    return;
  }
  verifyCode(code).then(function(ok){
    if(ok){
      L.fails=0;
      if(L.st==='enter'){hideLock();}
      else if(L.purpose==='change'){L.st='set1';L.buf='';L.msg='';L.cancel=true;drawLock();}
      else if(L.purpose==='off'){pput(null);HAS=false;hideLock();toast('パスコードを解除しました');if(S.tab==='menu')render();}
    }else{
      L.fails++;L.buf='';shake();
      if(L.fails>=5){L.fails=0;L.until=Date.now()+30000;L.msg='5回間違えました。30秒後にもう一度お試しください。';setTimeout(function(){if(L.st){L.msg='';drawLock();}},30000);}
      else{L.msg='パスコードが違います。';}
      drawLock();
    }
  });
}

/* ---------- calculator ---------- */
S.calcOpen=false;S.calc={expr:''};
function calcEval(str){
  var t=str.replace(/[+−×÷]$/,'');
  if(!t)return null;
  if(t.charAt(0)==='−')t='0'+t;
  var toks=t.match(/\d+\.?\d*|\.\d+|[+−×÷]/g);
  if(!toks)return null;
  var first=parseFloat(toks[0]);
  if(isNaN(first))return null;
  var terms=[first],ops=[];
  for(var i=1;i<toks.length;i+=2){
    var op=toks[i],n=parseFloat(toks[i+1]);
    if(isNaN(n))return null;
    if(op==='×'){terms[terms.length-1]*=n;}
    else if(op==='÷'){if(n===0)return 'err';terms[terms.length-1]/=n;}
    else{ops.push(op);terms.push(n);}
  }
  var r=terms[0];
  ops.forEach(function(o,j){r=o==='+'?r+terms[j+1]:r-terms[j+1];});
  return r;
}
function resTxt(){
  var e=S.calc.expr;
  if(!/[+−×÷]/.test(e.slice(1)))return '';
  var r=calcEval(e);
  if(r==='err')return '計算できません';
  if(r===null)return '';
  return '= '+(Math.round(r*100)/100).toLocaleString('ja-JP',{maximumFractionDigits:2});
}
function calcHtml(){
  var k=function(v,l,c){return '<button type="button" class="'+(c||'')+'" data-act="calcKey" data-v="'+v+'">'+(l||v)+'</button>';};
  return '<section class="calc" aria-label="電卓"><div class="cdisp"><div class="cexpr num" id="cexpr">'+esc(S.calc.expr||'0')+'</div><div class="cres" id="cres">'+esc(resTxt())+'</div></div><div class="ckeys">'+
    k('C','C','f')+k('back','⌫','f')+k('÷','÷','o')+k('×','×','o')+k('7')+k('8')+k('9')+k('−','−','o')+k('4')+k('5')+k('6')+k('+','+','o')+k('1')+k('2')+k('3')+k('=','=','eq')+k('0','0','w2')+k('.')+k('use','反映','use')+'</div></section>';
}
function calcKey(v){
  var e=S.calc.expr,last=e.slice(-1),isOp=/^[+−×÷]$/;
  if(v==='C'){e='';}
  else if(v==='back'){e=e.slice(0,-1);}
  else if(v==='='){
    var r=calcEval(e);
    if(r==='err'||r===null){toast('計算できません');return;}
    e=String(Math.round(r*100)/100).replace('-','−');
  }
  else if(v==='use'){
    var r2=calcEval(e);
    if(r2==='err'||r2===null){toast('計算できません');return;}
    var n=Math.round(r2);
    if(!(n>0)){toast('金額は1円以上にしてください');return;}
    if(n>99999999){toast('金額が大きすぎます');return;}
    capture();S.draft.amt=String(n);S.calcOpen=false;render();toast('金額に反映しました: '+yen(n)+'円');return;
  }
  else if(isOp.test(v)){
    if(!e){return;}
    if(isOp.test(last)){e=e.slice(0,-1)+v;}else{e+=v;}
  }
  else{
    var cur=(e.match(/[\d.]*$/)||[''])[0];
    if(v==='.'){if(cur.indexOf('.')>=0)return;e+=cur?'.':'0.';}
    else{
      if(cur.length>=12)return;
      if(cur==='0'){e=e.slice(0,-1)+v;}else{e+=v;}
    }
  }
  if(e.length>40)return;
  S.calc.expr=e;
  var ex=document.getElementById('cexpr'),rs=document.getElementById('cres');
  if(ex)ex.textContent=e||'0';
  if(rs)rs.textContent=resTxt();
}

function rrect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();}

function b64ToBytes(b64){var bin=atob(b64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++){u[i]=bin.charCodeAt(i);}return u;}
function buildPdf(jpegs){
  var enc=new TextEncoder(),chunks=[],offs=[],len=0,n=jpegs.length;
  function push(b){chunks.push(b);len+=b.length;}
  function str(t){push(enc.encode(t));}
  function obj(id,fn){offs[id]=len;str(id+' 0 obj\n');fn();str('endobj\n');}
  str('%PDF-1.4\n');
  obj(1,function(){str('<< /Type /Catalog /Pages 2 0 R >>\n');});
  var kids=[];for(var i=0;i<n;i++){kids.push((3+i*3)+' 0 R');}
  obj(2,function(){str('<< /Type /Pages /Count '+n+' /Kids ['+kids.join(' ')+'] >>\n');});
  jpegs.forEach(function(jp,i){
    var pid=3+i*3,cid=4+i*3,iid=5+i*3,content='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pid,function(){str('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\n');});
    obj(cid,function(){str('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\n');});
    obj(iid,function(){str('<< /Type /XObject /Subtype /Image /Width '+RW+' /Height '+RH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp.length+' >>\nstream\n');push(jp);str('\nendstream\n');});
  });
  var total=2+n*3,xref=len;
  str('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(var j=1;j<=total;j++){str(('0000000000'+offs[j]).slice(-10)+' 00000 n \n');}
  str('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  var out=new Uint8Array(len),p=0;
  chunks.forEach(function(ch){out.set(ch,p);p+=ch.length;});
  return out;
}
async function buildNow(){

  var ds=e.target&&e.target.dataset;
  if(ds&&ds.balacc){
    var n=ds.balacc,k=ds.balk,b=balGet(n);
    if(k==='a'){
      var raw=norm(e.target.value).replace(/[,，¥￥円\s]/g,'').replace('−','-');
      if(raw===''){S.bal=S.bal.filter(function(x){return x.n!==n;});}
      else if(/^-?\d{1,9}$/.test(raw)){if(b)b.a=+raw;else S.bal.push({n:n,a:+raw,d:TODAY});}
      else{toast('金額は数字で入力してください');render();return;}
    }else if(k==='d'&&b&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){b.d=e.target.value;}
    saveBud();render();return;
  }
  var id=e.target&&e.target.id,v=e.target&&e.target.value;
  if(id==='lfdf'){S.fdf=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';}
  else if(id==='lfdt'){S.fdt=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';}
  else if(id==='lfmin'||id==='lfmax'){var n=norm(v).replace(/[,，¥￥円\s]/g,'');n=/^\d+$/.test(n)?String(Math.min(+n,99999999)):'';if(id==='lfmin')S.fmin=n;else S.fmax=n;}
  else if(id==='lft'){S.ftag=v;}
  else return;
  render();
});
document.addEventListener('click',function(e){
  var cb=e.target.closest('[data-act="clgo"],[data-act="clsave"],[data-act="clundo"],[data-act="clview"]');
  if(cb){
    var ca=cb.dataset.act,nt=document.getElementById('clnote'),note=nt?nt.value.trim().slice(0,200):'';
    if(ca==='clview'){S.month=cb.dataset.v;go('stats');return;}
    if(ca==='clundo'){S.cl=S.cl.filter(function(x){return x.m!==S.month;});toast('締めを取り消しました');}
    else if(ca==='clsave'){var ex=clGet(S.month);if(ex)ex.note=note;toast('メモを更新しました');}
    else{S.cl=S.cl.filter(function(x){return x.m!==S.month;});S.cl.push({m:S.month,note:note,ts:Date.now()});toast(mlabel(S.month)+'を締めました');}
    saveBud();render();return;
  }
  var cs=e.target.closest('[data-act="catsug"]');
  if(cs){var rd=Array.prototype.find.call(document.querySelectorAll('input[name=cat]'),function(x){return x.value===cs.dataset.v;});if(rd){rd.checked=true;var bx2=document.getElementById('catsug');if(bx2)bx2.innerHTML='';}return;}
  var fb=e.target.closest('[data-act="fadv"],[data-act="fclr"]');
  if(fb){if(fb.dataset.act==='fadv'){S.fopen=!(S.fopen||S.fdf||S.fdt||S.fmin||S.fmax||S.ftag);if(!S.fopen){S.fdf=S.fdt=S.fmin=S.fmax=S.ftag='';}}else{S.fdf=S.fdt=S.fmin=S.fmax=S.ftag=S.fcat=S.fpay=S.fbank=S.q='';}render();return;}
  var yb=e.target.closest('[data-act="yrprev"],[data-act="yrnext"]');
  if(yb){S.yr=((S.yr&&S.yrMonth===S.month)?S.yr:+S.month.slice(0,4))+(yb.dataset.act==='yrprev'?-1:1);S.yrMonth=S.month;render();return;}
  var el=e.target.closest('[data-act^="ln"],[data-act^="csv"]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,ln=S.loans.find(function(x){return x.id===v;});
  if(a==='lndone'&&ln){ln.done=true;ln.doneAt=Date.now();saveLoan(ln).then(function(){toast('精算済みにしました');render();});}
  else if(a==='lnundo'&&ln){ln.done=false;delete ln.doneAt;saveLoan(ln).then(function(){render();});}
  else if(a==='lndel'){
    if(S.lnArmed===v){S.lnArmed=null;delLoan(v).then(function(){render();});}
    else{S.lnArmed=v;render();setTimeout(function(){if(S.lnArmed===v){S.lnArmed=null;if(S.tab==='menu')render();}},4000);}
  }
  else if(a==='lnadd'){
    var who=(document.getElementById('lnw').value||'').trim().slice(0,16),amt=+String(document.getElementById('lna').value).replace(/[,，¥￥円\s]/g,'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);});
    if(!who){toast('相手の名前を入力してください');return;}
    if(!Number.isInteger(amt)||amt<=0||amt>99999999){toast('金額は1円以上の数字で入力してください');return;}
    addLoan({who:who,a:amt,dir:document.getElementById('lnd').value==='out'?'out':'in',m:(document.getElementById('lnm').value||'').trim().slice(0,60),d:TODAY,done:false,ts:Date.now()}).then(function(){toast('追加しました');render();});
  }
  else if(a==='csvdl'){
    (async function(){
      var blob=new Blob(['\ufeff'+csvText()],{type:'text/csv;charset=utf-8'}),name='stera-bank-'+TODAY+'.csv',dl=null;
      try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(x){dl=null;}
      if(dl){try{await dl.save({filename:name,data:blob});toast(S.txs.length+'件を書き出しました');}catch(x){if(!x||x.code!=='declined')toast('書き出せませんでした');}return;}
      try{var u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast(S.txs.length+'件を書き出しました');}
      catch(err){S.csv=csvText();render();toast('下の欄の内容をコピーして保存してください');}
    })();
  }
  else if(a==='csvpick'){var f=document.getElementById('csvfile');if(f){f.value='';f.click();}}
  else if(a==='csvno'){S.csvImp=null;render();}
  else if(a==='csvflip'&&S.csvImp&&S.csvImp.bank){bankFlip();render();}
  else if(a==='csvgo'&&S.csvImp){
    var bkpe=document.getElementById('bkpay'),bkpv=bkpe?bkpe.value:'';var rows=S.csvImp.rows;S.csvImp=null;el.disabled=true;if(bkpv)rows.forEach(function(r){r.p=bkpv;});
    (async function(){for(var i=0;i<rows.length;i++){await addTx(rows[i]);}toast(rows.length+'件を取り込みました');render();})();
  }
});

    e.preventDefault();var fn=S.undoFn;hideUndo();S.noUndo=true;Promise.resolve().then(fn).then(function(){S.noUndo=false;toast('元に戻しました');render();},function(){S.noUndo=false;});

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act^="tpl"],[data-act^="pl"]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v,tp=S.tpl.find(function(x){return x.id===v;}),pi=S.plan.find(function(x){return x.id===v;});
  if(a==='tplfill'&&tp){
    var am=document.getElementById('amt'),mm=document.getElementById('memo'),py=document.getElementById('pay'),tg=document.getElementById('xtg');
    if(am)am.value=String(tp.a);if(mm)mm.value=tp.m||'';if(py)py.value=tp.p||'';if(tg)tg.value=(tp.tg||[]).join(' ');

    var cb=document.getElementById('catsug');if(cb)cb.innerHTML='';
    toast('テンプレートを入れました');if(am)am.focus();
  }
  else if(a==='tplrec'&&tp){
    var t={d:TODAY,t:tp.t,c:tp.c,a:tp.a,m:tp.m||'',p:tp.p||'',ts:Date.now()};if(tp.tg&&tp.tg.length)t.tg=tp.tg.slice();
    S.month=TODAY.slice(0,7);
    addTx(t).then(function(){
      toast((t.t==='out'?'支出':'収入')+'を記録しました: '+tp.n+' '+yen(t.a)+'円');
      offerUndo('記録しました',function(){var x=S.txs.find(function(y){return y.ts===t.ts&&y.a===t.a;});return x?delTx0(x.id):Promise.resolve();});
    });
  }
  else if(a==='tplsave'){
    var raw=norm((document.getElementById('amt')||{}).value||''),cc=document.querySelector('input[name=cat]:checked'),memo=((document.getElementById('memo')||{}).value||'').trim(),pe=document.getElementById('pay'),tv=document.getElementById('xtg');
    if(!/^\d+$/.test(raw)||+raw<=0||+raw>99999999){toast('先に金額を入力してください');return;}
    var nm=(memo||(cc?cc.value:'その他')).slice(0,16),o={id:newId(),n:nm,t:S.addType,c:cc?cc.value:'その他',a:+raw,m:memo,p:pe?String(pe.value).slice(0,20):'',tg:tv?tgParse(tv.value):[]};
    var ex=S.tpl.findIndex(function(x){return x.n===nm&&x.t===o.t;});
    if(ex>=0){o.id=S.tpl[ex].id;S.tpl[ex]=o;}
    else{if(S.tpl.length>=12){toast('テンプレートは12件までです');return;}S.tpl.push(o);}
    saveBud();capture();S.draft.tg=o.tg;render();toast('テンプレートに保存しました');
  }
  else if(a==='tpldel'){
    if(S.tplArmed===v){S.tplArmed=null;S.tpl=S.tpl.filter(function(x){return x.id!==v;});saveBud();render();}
    else{S.tplArmed=v;render();setTimeout(function(){if(S.tplArmed===v){S.tplArmed=null;if(S.tab==='menu')render();}},4000);}
  }
  else if(a==='pladd'){
    var nn=(document.getElementById('plname').value||'').trim().slice(0,20),am2=+norm(document.getElementById('plamt').value),mo=document.getElementById('plm').value;
    if(!nn){toast('名前を入力してください');return;}
    if(!Number.isInteger(am2)||am2<=0||am2>99999999){toast('金額は1円以上の数字で入力してください');return;}
    if(!/^\d{4}-\d{2}$/.test(mo||'')){toast('予定の月を選んでください');return;}
    S.plan.push({id:newId(),k:document.getElementById('plk').value==='in'?'in':'out',name:nn,a:am2,m:mo,done:false,ts:Date.now()});
    saveBud();render();toast('プランに追加しました');
  }
  else if(a==='pldone'&&pi){pi.done=!pi.done;saveBud();render();}
  else if(a==='pldel'){
    if(S.plArmed===v){S.plArmed=null;S.plan=S.plan.filter(function(x){return x.id!==v;});saveBud();render();}
    else{S.plArmed=v;render();setTimeout(function(){if(S.plArmed===v){S.plArmed=null;if(S.tab==='goals')render();}},4000);}
  }
});
/* ---------- tutorial (first-run guide + replay from the help popup) ---------- */
var TOUR_KEY='stera-tutorial-v1';
function tourDone(){try{return localStorage.getItem(TOUR_KEY)==='1';}catch(e){return false;}}
function tourMark(){try{localStorage.setItem(TOUR_KEY,'1');}catch(e){}}
var TOUR=(function(){
  var steps=[
    {t:'STERA BANK へようこそ',b:'支出と収入を記録して、月ごとの収支・予算・支払い予定をひとつにまとめる家計簿アプリです。1分ほどで主な使いかたをご案内します。',mid:true,logo:true},
    {sel:'.v-home .card',pre:'home',t:'今月の収支',b:'収入から支出を引いた今月の残りが大きく表示されます。上の矢印で月を切り替えられ、目のアイコンで金額を隠せます。'},
    {sel:'.v-home .grid',pre:'home',t:'ショートカット',b:'「支出を記録」「収入を記録」で入力画面へ進めます。明細・集計・電卓・タスクにもここからすぐ移動できます。'},
    {sel:'.tabs .tab[data-v="add"]',t:'入力',b:'支出や収入を1件ずつ記録します。金額・カテゴリ・日付を入れて保存するだけです。電卓も使えます。'},
    {sel:'.tabs .tab[data-v="list"]',t:'明細',b:'月ごとの記録の一覧です。言葉や金額で探せます。記録の編集と削除もここで行います。'},
    {sel:'.tabs .tab[data-v="stats"]',t:'集計',b:'カテゴリごとの支出を予算と見比べられます。月次レポートをPDFにすることもできます。'},
    {sel:'.tabs .tab[data-v="menu"]',t:'設定',b:'カテゴリごとの予算、支払い方法、定期の支出・収入、パスコード、バックアップはここで設定します。'},
    {sel:'.top .hbtn[data-act="help"]',t:'困ったときは',b:'右上の「?」から、いつでも使いかたを開けます。このチュートリアルもそこからもう一度見られます。'},
    {t:'準備ができました',b:'まずは支出を1件記録してみましょう。',mid:true,last:true}
  ];
  var el=null,i=0,tm=0,keyOn=false,lastKey='';
  function q(n){return el&&el.querySelector(n);}
  function target(st){
    if(!st||!st.sel)return null;
    var n=document.querySelector(st.sel);
    if(!n)return null;
    var r=n.getBoundingClientRect();
    return (r.width>0&&r.height>0)?n:null;
  }
  function dots(){var h='';for(var k=0;k<steps.length;k++)h+='<i'+(k===i?' class="on"':'')+'></i>';return h;}
  function draw(){
    var st=steps[i],isFirst=i===0,isLast=!!st.last,t=target(st);
    var mid=!!st.mid||!t;
    var card=q('.tcard');
    card.className='tcard'+(mid?' mid':'');
    var h='';
    if(st.logo)h+='<span class="tlogo" aria-hidden="true">'+logoSvg()+'</span>';
    h+='<div class="tprog"><span class="tdots" aria-hidden="true">'+dots()+'</span><span class="tnum">'+(i+1)+' / '+steps.length+'</span></div>';
    h+='<h2 id="ttitle">'+esc(st.t)+'</h2><p>'+esc(st.b)+'</p><div class="tact">';
    if(isLast){
      h+='<button type="button" class="tnext" data-tour="add">支出を記録してみる</button><button type="button" class="tback" data-tour="prev">戻る</button><button type="button" class="tskip" data-tour="end">あとで</button>';
    }else if(isFirst){
      h+='<button type="button" class="tnext" data-tour="next">はじめる</button><button type="button" class="tskip" data-tour="end">スキップ</button>';
    }else{
      h+='<button type="button" class="tskip" data-tour="end">スキップ</button><button type="button" class="tback" data-tour="prev">戻る</button><button type="button" class="tnext" data-tour="next">次へ</button>';
    }
    h+='</div>';
    card.innerHTML=h;
    lastKey='';
    place(true);
    var nb=q('.tnext');if(nb)nb.focus({preventScroll:true});
  }
  function place(force){
    if(!el)return;
    var st=steps[i],n=target(st),spot=q('.tspot'),card=q('.tcard');
    var vw=window.innerWidth,vh=window.innerHeight;
    var isMid=card.classList.contains('mid');
    if(!lockEl.hidden){end('quiet');return;}
    if(!!st.sel&&((!n&&!isMid)||(n&&isMid&&!st.mid))){draw();return;}
    var rect=n?n.getBoundingClientRect():null;
    var key=rect?[rect.left|0,rect.top|0,rect.width|0,rect.height|0,vw,vh].join(','):'m'+vw+'x'+vh;
    if(!force&&key===lastKey)return;
    lastKey=key;
    var cw=card.offsetWidth,ch=card.offsetHeight,x,y;
    if(!rect||isMid){
      spot.className='tspot none';
      spot.style.cssText='left:'+(vw/2)+'px;top:'+(vh/2)+'px;width:0;height:0';
      x=(vw-cw)/2;y=(vh-ch)/2;
    }else{
      var pd=8,l=rect.left-pd,tp=rect.top-pd,w=rect.width+pd*2,hh=rect.height+pd*2;
      var br=parseFloat(getComputedStyle(n).borderTopLeftRadius)||12;
      spot.className='tspot';
      spot.style.cssText='left:'+l+'px;top:'+tp+'px;width:'+w+'px;height:'+hh+'px;border-radius:'+(br+pd)+'px';
      var gap=14,m=12,fits={
        below:tp+hh+gap+ch<=vh-m,
        above:tp-gap-ch>=m,
        right:l+w+gap+cw<=vw-m,
        left:l-gap-cw>=m
      };
      var order=(rect.left<280&&vw>=1024)?['right','below','above','left']:['below','above','right','left'];
      var pick=null;
      for(var k=0;k<order.length;k++){if(fits[order[k]]){pick=order[k];break;}}
      var cl=function(v,a,b){return Math.max(a,Math.min(b,v));};
      if(pick==='below'){y=tp+hh+gap;x=cl(rect.left+rect.width/2-cw/2,m,vw-cw-m);}
      else if(pick==='above'){y=tp-gap-ch;x=cl(rect.left+rect.width/2-cw/2,m,vw-cw-m);}
      else if(pick==='right'){x=l+w+gap;y=cl(rect.top+rect.height/2-ch/2,m,vh-ch-m);}
      else if(pick==='left'){x=l-gap-cw;y=cl(rect.top+rect.height/2-ch/2,m,vh-ch-m);}
      else{x=(vw-cw)/2;y=vh-ch-m;}
    }
    card.style.left=Math.round(x)+'px';card.style.top=Math.round(y)+'px';
  }
  function show(){
    var st=steps[i];
    if(st.pre&&S.tab!==st.pre){go(st.pre);}
    draw();
    var n=target(st);
    if(n&&!/^(fixed|sticky)$/.test(getComputedStyle(n).position)&&!n.closest('.tabs')&&!n.closest('.top')){
      var r=n.getBoundingClientRect(),vh=window.innerHeight;
      if(r.top<70||r.bottom>vh-70){
        var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
        try{n.scrollIntoView({block:'center',behavior:rm?'auto':'smooth'});}catch(e){n.scrollIntoView();}
      }
    }
  }
  function onKey(e){
    if(!el)return;
    var k=e.key,onBtn=e.target&&e.target.closest&&e.target.closest('button');
    if(k==='Escape'){end();}
    else if(k==='ArrowRight'){step(1);}
    else if(k==='ArrowLeft'){step(-1);}
    else if(k==='Enter'||k===' '){if(onBtn){e.stopPropagation();return;}if(k==='Enter')step(1);}
    else if(k==='Tab'){
      var f=el.querySelectorAll('button'),a=document.activeElement;
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&(a===first||!el.contains(a))){last.focus();e.preventDefault();}
      else if(!e.shiftKey&&(a===last||!el.contains(a))){first.focus();e.preventDefault();}
      return;
    }
    else{e.stopPropagation();return;}
    e.preventDefault();e.stopPropagation();
  }
  function step(d){
    var n=i+d;
    if(n<0)return;
    if(n>=steps.length){end();return;}
    i=n;show();
  }
  function end(go2){
    if(!el)return;
    if(go2!=='quiet')tourMark();
    clearInterval(tm);tm=0;
    window.removeEventListener('resize',onResize);
    window.removeEventListener('scroll',onResize,true);
    document.removeEventListener('keydown',onKey,true);
    el.remove();el=null;
    if(go2==='add'){S.addType='out';S.draft={amt:'',dt:'',memo:'',cat:''};go('add');}
    else{window.scrollTo(0,0);}
  }
  function onResize(){place(false);}
  function start(){
    if(el)return;
    if(!lockEl.hidden)return;
    S.kb=false;i=0;
    if(S.tab!=='home')go('home');else render();
    el=document.createElement('div');
    el.id='tour';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby','ttitle');
    el.innerHTML='<div class="tblock"></div><div class="tspot none"></div><div class="tcard" aria-live="polite"></div>';
    document.body.appendChild(el);
    el.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-tour]');
      if(!b)return;
      var a=b.getAttribute('data-tour');
      if(a==='next')step(1);else if(a==='prev')step(-1);else if(a==='add')end('add');else end();
    });
    document.addEventListener('keydown',onKey,true);
    window.addEventListener('resize',onResize);
    window.addEventListener('scroll',onResize,true);
    tm=setInterval(function(){place(false);},250);
    show();
  }
  return {start:start,open:function(){return !!el;}};
})();
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act="tour"]');
  if(!b)return;
  S.kb=false;render();TOUR.start();
});
/* first launch: wait for the splash, the lock screen and the data to finish, then offer the tour once */
(function(){
  if(tourDone())return;
  try{if(new URLSearchParams(location.search).get('add'))return;}catch(e){}
  var t0=Date.now(),poll=setInterval(function(){
    if(tourDone()||TOUR.open()){clearInterval(poll);return;}
    if(Date.now()-t0>120000){clearInterval(poll);return;}
    if(Date.now()-t0<2200||!S.ready||!lockEl.hidden||S.kb||S.editId)return;
    var bc=document.getElementById('bcm');if(bc)return;
    clearInterval(poll);TOUR.start();
