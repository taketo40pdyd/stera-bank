    if(title==='サブスク管理'&&S.subEdit)return true;
    if(title==='バックアップ'&&(S.imp||S.bk))return true;
    if(title==='データ'&&(S.csvImp||S.csv))return true;
    return false;
  }
  function sgFilter(){
    var q=(S.sgq||'').trim().toLowerCase();
    [].forEach.call(document.querySelectorAll('details.sg'),function(d){
      var hay=((d.dataset.sg||'')+' '+d.textContent).toLowerCase();
      if(q){d.hidden=hay.indexOf(q)<0;d.open=!d.hidden;}
      else{d.hidden=false;d.open=sgOpenFor(d.dataset.sg);}
    });
  }
  function sgEnhance(){
    if(S.tab!=='menu')return;
    var main=root.querySelector('main.wrap');if(!main)return;
    [].forEach.call(main.querySelectorAll('.c1,.c2'),function(col){
      var groups=[],cur=null;
      [].slice.call(col.children).forEach(function(k){
        if(k.classList&&k.classList.contains('ph')){cur={h:k,items:[]};groups.push(cur);}
        else if(cur)cur.items.push(k);
      });
      groups.forEach(function(g){
        var title=(g.h.textContent||'').trim(),d=document.createElement('details');
        d.className='sg';d.dataset.sg=title;
        var sm=document.createElement('summary');sm.textContent=title;d.appendChild(sm);
        var b=document.createElement('div');b.className='sgb';
        g.items.forEach(function(k){b.appendChild(k);});d.appendChild(b);
        col.insertBefore(d,g.h);g.h.remove();
      });
    });
    var two=main.querySelector('.two');
    if(two&&!main.querySelector('#sgq')){
      var w=document.createElement('div');w.className='sgsearch';
      w.innerHTML='<input class="field" type="search" id="sgq" placeholder="設定を探す(例: バックアップ・予算・カード)" aria-label="設定を探す" autocomplete="off" value="'+esc(S.sgq||'')+'">';
      main.insertBefore(w,two);
    }
    sgFilter();
  }
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='sgq'){S.sgq=e.target.value;sgFilter();}});
  document.addEventListener('click',function(e){
    var sm=e.target.closest&&e.target.closest('details.sg>summary');if(!sm)return;
    var d=sm.parentNode;setTimeout(function(){S.sgOpen=S.sgOpen||{};if(d.open)S.sgOpen[d.dataset.sg]=1;else delete S.sgOpen[d.dataset.sg];},0);
  });

  /* list hint for swipe */
  function listEnhance(){
    if(S.tab!=='list')return;
    var r=document.getElementById('selwrap')||document.getElementById('lres');
    if(r&&!document.querySelector('.swhint')){
      var p=document.createElement('p');p.className='note swhint';p.textContent='行を左にスワイプで削除(取り消せます)、右にスワイプで編集できます。';
      r.parentNode.insertBefore(p,r);
    }
  }
  var _rd=render;render=function(){_rd.apply(this,arguments);try{sgEnhance();listEnhance();}catch(e){}};

  /* swipe to delete / edit */
  var sw=null;
  document.addEventListener('touchstart',function(e){
    if(sel.on||e.touches.length!==1)return;
    var li=e.target.closest&&e.target.closest('#lres li.row');if(!li||e.target.closest('button,a,select,input,textarea'))return;
    var b=li.querySelector('[data-act="edit"]');if(!b)return;
    var t=e.touches[0];sw={li:li,id:b.dataset.v,x:t.clientX,y:t.clientY,dx:0,lock:0};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!sw)return;var t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
    if(!sw.lock){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5)sw.lock=1;else if(Math.abs(dy)>12){sw=null;return;}else return;}
    sw.dx=dx;sw.li.style.transition='none';sw.li.style.transform='translateX('+Math.max(-140,Math.min(140,dx))+'px)';
    sw.li.style.background=dx<0?'color-mix(in srgb,#C4122F 14%,var(--surface))':'color-mix(in srgb,#2B7BA6 14%,var(--surface))';
  },{passive:true});
  function swReset(x){x.li.style.transition='';x.li.style.transform='';x.li.style.background='';}
  document.addEventListener('touchend',function(){
    if(!sw)return;var x=sw;sw=null;swReset(x);
    if(!x.lock)return;
    if(x.dx<=-90){var t=S.txs.find(function(y){return y.id===x.id;});if(t)removeMany([t]);}
    else if(x.dx>=90){var b=x.li.querySelector('[data-act="edit"]');if(b)b.click();}
  });
  document.addEventListener('touchcancel',function(){if(sw){swReset(sw);sw=null;}});

  /* bulk change of payment method */
  var _bar=barHtml;
  barHtml=function(){
    var h=_bar.apply(this,arguments);
    if(!sel.on||!ids().length)return h;
    var sp='<select class="field" id="selpay" aria-label="支払い方法をまとめて変更"><option value="">支払い方法を変更…</option><option value="__none">指定なし</option>'+payOpts(payNames(),'')+'</select>';
    return h.replace('<button type="button" class="ghost" data-act="seldel"',sp+'<button type="button" class="ghost" data-act="seldel"');
  };
  document.addEventListener('change',function(e){
    if(!e.target||e.target.id!=='selpay'||!e.target.value)return;
    var pv=e.target.value==='__none'?'':e.target.value,L=S.txs.filter(function(t){return sel.ids[t.id];}),prev=L.map(function(t){return [t.id,t.p||''];});
    Promise.all(L.map(function(t){return updateTx0(t.id,{p:pv});})).then(function(){
      sel.ids={};render();
      offerUndo(L.length+'件の支払い方法を変えました',function(){return Promise.all(prev.map(function(p){return updateTx0(p[0],{p:p[1]});}));});
    });
  });

  /* quick input: recent chips and memo autofill */
  function fillForm(t){
    var am=document.getElementById('amt'),mm=document.getElementById('memo'),py=document.getElementById('pay'),tg=document.getElementById('xtg');
    if(am)am.value=String(t.a);if(mm)mm.value=t.m||'';if(py)py.value=t.p||'';if(tg)tg.value=(t.tg||[]).join(' ');
    var rd=[].find.call(document.querySelectorAll('input[name=cat]'),function(x){return x.value===t.c;});if(rd)rd.checked=true;
    var cb=document.getElementById('catsug');if(cb)cb.innerHTML='';
  }
  document.addEventListener('click',function(e){
    var el=e.target.closest&&e.target.closest('[data-act="recentfill"]');if(!el)return;
    var t=(S.recent||[])[+el.dataset.v];if(!t)return;
    fillForm(t);toast('前回の入力を入れました');var am=document.getElementById('amt');if(am&&window.matchMedia&&window.matchMedia('(min-width:1024px)').matches)am.focus();
  });
  document.addEventListener('change',function(e){
    if(!e.target||e.target.id!=='memo'||S.editId)return;
    var am=document.getElementById('amt');if(!am||am.value.trim())return;
    var m=e.target.value.trim();if(!m)return;
    var t=S.txs.find(function(x){return x.t===S.addType&&(x.m||'')===m;});
    if(!t)return;
    var mm=e.target.value;fillForm(t);e.target.value=mm;toast('前回の金額と分類を入れました');
  });
})();

function printMon(){
  var m=S.month,c=calc(m),old=document.getElementById('prt');if(old)old.remove();
  var d=document.createElement('div');d.id='prt';
  var rows=OUT.filter(function(k){return c.cat[k]||+S.budgets[k];}).map(function(k){
    var sp=c.cat[k]||0,b=+S.budgets[k]||0;
    return '<tr'+(b&&sp>b?' class="over"':'')+'><td>'+esc(k)+'</td><td>'+yen(sp)+'円</td><td>'+(b?yen(b)+'円':'—')+'</td><td>'+(b?(b-sp<0?'−':'')+yen(Math.abs(b-sp))+'円':'—')+'</td></tr>';
  }).join('');
  d.innerHTML='<h1>STERA BANK '+m.slice(0,4)+'年'+(+m.slice(5,7))+'月のレポート</h1><p>収入 '+yen(c.inc)+'円 / 支出 '+yen(c.exp)+'円 / 収支 '+(c.inc-c.exp<0?'−':'')+yen(Math.abs(c.inc-c.exp))+'円 / 記録 '+c.rows.length+'件</p>'
   +'<table><thead><tr><th>カテゴリ</th><th>支出</th><th>予算</th><th>残り</th></tr></thead><tbody>'+rows+'<tr><th>合計</th><th>'+yen(c.exp)+'円</th><th>'+(c.bud?yen(c.bud)+'円':'—')+'</th><th>'+(c.bud?(c.remain<0?'−':'')+yen(Math.abs(c.remain))+'円':'—')+'</th></tr></tbody></table><p style="font-size:11px">出力日 '+TODAY+'</p>';
  document.body.appendChild(d);
  var done=function(){var x=document.getElementById('prt');if(x)x.remove();window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  try{window.print();}catch(e){done();toast('印刷を開けませんでした');}
}

document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act="selon"],[data-act="seloff"],[data-act="selt"],[data-act="selall"],[data-act="seldel"],[data-act="chkrun"],[data-act="chkdup"],[data-act="fsset"],[data-act="prtmon"]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  if(a==='selt'){if(el.tagName==='LI'&&e.target.closest('button.selb'))return;sel.ids[v]=!sel.ids[v];refresh();}
  else if(a==='selon'){sel.on=true;sel.ids={};render();}
  else if(a==='seloff'){sel.on=false;sel.ids={};render();}
  else if(a==='selall'){var rs=listFiltered(),all=rs.every(function(t){return sel.ids[t.id];});rs.forEach(function(t){sel.ids[t.id]=!all;});refresh();}
  else if(a==='seldel'){
    if(el.dataset.arm!=='1'){el.dataset.arm='1';el.textContent='もう一度押すと'+ids().length+'件を削除';setTimeout(function(){if(el.isConnected){el.dataset.arm='';el.textContent='削除';}},4000);return;}
    var L=S.txs.filter(function(t){return sel.ids[t.id];});el.disabled=true;
    removeMany(L).then(function(){sel.ids={};sel.on=false;render();});
  }
  else if(a==='chkrun'){runCheck();render();}
  else if(a==='chkdup'){
    if(!dupArm){dupArm=true;render();setTimeout(function(){if(dupArm){dupArm=false;if(S.tab==='menu'||S.tab==='account')render();}},4000);return;}
    var L2=chk?chk.dups.slice():[];dupArm=false;
    removeMany(L2).then(function(){runCheck();render();toast(L2.length+'件の重複を削除しました');});
  }
  else if(a==='fsset'){try{localStorage.setItem(FK,String(+v));}catch(x){}fsApply();render();toast('文字サイズを変えました');}
  else if(a==='prtmon'){printMon();}
});
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='selcat'||!e.target.value)return;
  var c=e.target.value,L=S.txs.filter(function(t){return sel.ids[t.id];}),prev=L.map(function(t){return [t.id,t.c];});
  Promise.all(L.map(function(t){return updateTx0(t.id,{c:c});})).then(function(){
    sel.ids={};render();
    offerUndo(L.length+'件のカテゴリを変えました',function(){return Promise.all(prev.map(function(p){return updateTx0(p[0],{c:p[1]});}));});
  });
});
})();
/* ---------- view-only mode (閲覧モード) ---------- */
(function(){
  var SAFE={tab:1,eye:1,mprev:1,mnext:1,yrprev:1,yrnext:1,calday:1,filter:1,fadv:1,fclr:1,fall:1,fctoggle:1,asr:1,asm:1,aspt:1,reportOpen:1,rprev:1,rnext:1,tfilter:1,kb:1,kbclose:1,help:1,tour:1,wnopen:1,theme:1,accent:1,hidestart:1,sound:1,fsset:1,prtmon:1,clview:1,lockNow:1,csv:1,csvdl:1,csvflip:1,csvno:1,bkexport:1,updchk:1,updgo:1,updx:1,install:1,viewmode:1,subsort:1,subfilter:1,subcsv:1,tdq:1,gq:1,gqn:1,gqd:1};
  window.addEventListener('click',function(e){
    if(!ST.view)return;
    var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
    var a=el.dataset.act;
    if(SAFE[a]&&!(a==='tab'&&el.dataset.v==='add'))return;
    e.stopImmediatePropagation();e.preventDefault();
    toast('閲覧モード中は変更できません(右上の鍵で解除)');
  },true);
  window.addEventListener('submit',function(e){
    if(!ST.view)return;
    e.stopImmediatePropagation();e.preventDefault();
    toast('閲覧モード中は変更できません(右上の鍵で解除)');
  },true);
  document.addEventListener('click',function(e){
    var el=e.target.closest&&e.target.closest('[data-act="viewmode"]');if(!el)return;
    ST.view=!ST.view;stSave();render();
    toast(ST.view?'閲覧モードをオンにしました':'閲覧モードを解除しました');
  });
  document.documentElement.classList.toggle('vm',!!ST.view);
  if(ST.view&&typeof render==='function')render();
})();
})();
